name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser automation
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Open app and sign in as visitor
        run: |
          python3 - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          app_url = "https://hwdaily-98ndujx5ggppuujkx5r8lf.streamlit.app/"

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(app_url, wait_until="domcontentloaded", timeout=180_000)

              wake_button = page.get_by_role(
                  "button",
                  name=re.compile(r"get this app back up", re.IGNORECASE),
              )
              if wake_button.count() and wake_button.first.is_visible():
                  wake_button.first.click()

              visitor_button = page.get_by_role(
                  "button",
                  name=re.compile("訪客快速登入"),
              )
              visitor_button.wait_for(state="visible", timeout=180_000)
              visitor_button.click()

              page.get_by_text("帳號資訊", exact=False).wait_for(
                  state="visible",
                  timeout=60_000,
              )
              print(f"Visitor session established: {page.url}")
              page.wait_for_timeout(10_000)
              browser.close()
          PY
